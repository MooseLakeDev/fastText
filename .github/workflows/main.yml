name: Build Python 3.14 wheel from upstream

on: [push, workflow_dispatch]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Клонировать оригинальный fastText
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/fastText
          path: fasttext-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Python‑зависимости
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.8

      - name: Сборка колеса
        run: |
          cd fasttext-src/python
          pip wheel --wheel-dir=dist --no-build-isolation --no-deps .

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-wheel-py314
          path: fasttext-src/python/dist/*.whl
