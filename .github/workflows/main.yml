name: Build Python 3.14 wheel for fastText (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: windows-latest  # Переключаемся на Windows

    steps:
      - name: Клонировать оригинальный fastText
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/fastText
          path: fasttext-src

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Установка зависимостей сборки
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install "cython>=3.0.8" pybind11

      - name: Сборка колеса (Windows)
        shell: bash  # Используем bash для удобства навигации по папкам
        run: |
          cd fasttext-src
          # Используем современный модуль build вместо setup.py bdist_wheel
          python -m build --wheel
          ls -la dist/

      - name: Загрузить артефакт (колесо)
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-windows-wheel-py314
          path: fasttext-src/dist/*.whl
