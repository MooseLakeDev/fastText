name: Build Python 3.14 wheel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Python‑зависимости
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.8   # самая свежая стабильная (или >=3.1 если есть)

      - name: Диагностика – список файлов
        run: |
          echo "=== Корень репозитория ==="
          ls -la
          echo "=== Содержимое python/ ==="
          ls -la python || echo "ОШИБКА: папка python не найдена!"

      - name: Сборка колеса
        run: |
          cd python
          pip wheel --wheel-dir=dist --no-build-isolation --no-deps .

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-wheel-py314
          path: python/dist/*.whl
