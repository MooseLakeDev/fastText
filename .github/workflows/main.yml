name: Build Python 3.14 wheel for fastText (Windows Clean)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: windows-latest

    steps:
      - name: Клонировать репозиторий fastText
        uses: actions/checkout@v4
        with:
          # Укажите здесь свой форк, куда залили обновленный setup.py
          repository: ВАШ_НИК_НА_GITHUB/fastText 
          path: fasttext-src

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Установка зависимостей сборки
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install "cython>=3.0.8" pybind11 numpy

      - name: Сборка колеса (Windows)
        shell: bash
        run: |
          cd fasttext-src
          python -m build --wheel
          ls -la dist/

      - name: Загрузить артефакт (колесо)
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-windows-wheel-py314
          path: fasttext-src/dist/*.whl
