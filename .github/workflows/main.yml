name: Build Python 3.14 wheel for Windows

on:
  workflow_dispatch:

jobs:
  build-wheel-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Клонировать оригинальный fastText
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/fastText
          path: fasttext-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.8 pybind11

      - name: Пропатчить setup.py для совместимости с MSVC
        run: |
          cd fasttext-src
          python << 'EOF'
          import re
          with open('setup.py', 'r') as f:
              content = f.read()
          # Меняем стандарт C++ на нужный MSVC
          content = content.replace("'-std=c++17'", "'/std:c++17'")
          # Убираем флаг скрытой видимости
          content = content.replace(", '-fvisibility=hidden'", '')
          # Добавляем определение ssize_t (ptrdiff_t) для MSVC
          content = re.sub(
              r"(\['-DVERSION_INFO=.+?', '/std:c\+\+17')",
              r"\1, '-Dssize_t=ptrdiff_t'",
              content
          )
          with open('setup.py', 'w') as f:
              f.write(content)
          print('setup.py patched successfully')
          EOF

      - name: Сборка колеса
        run: |
          cd fasttext-src
          python setup.py bdist_wheel
          echo "Содержимое dist/:"
          ls -la dist/

      - name: Загрузить артефакт (Windows wheel)
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-wheel-py314-win
          path: fasttext-src/dist/*.whl
