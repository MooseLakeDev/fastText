name: Build Python 3.14 wheel for Windows

on:
  workflow_dispatch:          # запуск только вручную (можно добавить push при желании)

jobs:
  build-wheel-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash           # использовать bash, чтобы команды были кроссплатформенными

    steps:
      - name: Клонировать оригинальный fastText
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/fastText
          path: fasttext-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Установка Python-зависимостей
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.8 pybind11

      - name: Сборка колеса
        run: |
          cd fasttext-src
          python setup.py bdist_wheel
          echo "Содержимое dist/:"
          ls -la dist/

      - name: Загрузить артефакт (Windows wheel)
        uses: actions/upload-artifact@v4
        with:
          name: fasttext-wheel-py314-win
          path: fasttext-src/dist/*.whl
